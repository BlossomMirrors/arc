app-id: org.blossomos.Arc
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk//6.8
command: arc

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --socket=session-bus
  # arc-daemon talks to distrobox on the host via flatpak-spawn
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: arc
    buildsystem: simple
    build-commands:
      - install -Dm755 arc-frontend /app/bin/arc-frontend
      - install -Dm755 arc-daemon /app/bin/arc-daemon
      - install -Dm755 arc /app/bin/arc
      - install -Dm644 org.blossomos.Arc.desktop /app/share/applications/org.blossomos.Arc.desktop
      - install -Dm644 org.blossomos.Arc.metainfo.xml /app/share/metainfo/org.blossomos.Arc.metainfo.xml
      - install -Dm644 org.blossomos.Arc.xml /app/share/mime/packages/org.blossomos.Arc.xml
      - install -Dm644 arc.svg /app/share/icons/hicolor/scalable/apps/org.blossomos.Arc.svg
    sources:
      - type: file
        path: target/release/arc-frontend
      - type: file
        path: target/release/arc-daemon
      - type: script
        dest-filename: arc
        commands:
          - arc-daemon &
          - DAEMON_PID=$!
          - trap "kill $DAEMON_PID 2>/dev/null" EXIT
          - sleep 0.5
          - exec arc-frontend "$@"
      - type: file
        path: arc.svg
      - type: file
        path: org.blossomos.Arc.desktop
      - type: file
        path: org.blossomos.Arc.metainfo.xml
      - type: file
        path: org.blossomos.Arc.xml
