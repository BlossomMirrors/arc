[package]
name = "arc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
libarc = { path = "../libarc" }
clap = { version = "4", features = ["derive"] }
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
futures-util = "0.3"
