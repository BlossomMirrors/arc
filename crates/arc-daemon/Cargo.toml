[package]
name = "arc-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arc-daemon"
path = "src/main.rs"

[dependencies]
libarc = { path = "../libarc" }
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
libflatpak = "0.7"
appstream = { version = "0.2", features = ["gzip"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.44"
flate2 = "1"
scraper = "0.22"
