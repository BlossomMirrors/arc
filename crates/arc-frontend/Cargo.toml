[package]
name = "arc-frontend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arc-frontend"
path = "src/main.rs"

[dependencies]
libarc = { path = "../libarc" }
slint = "1"
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.44"
flate2 = "1"
appstream = { version = "0.2", features = ["gzip"] }

[build-dependencies]
slint-build = "1"
